name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version tag
        id: version
        shell: bash
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            new_tag="v1"
          else
            current=${latest#v}
            next=$((current + 1))
            new_tag="v${next}"
          fi

          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$new_tag"
          git push origin "$new_tag"

  build:
    needs: bump-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests if available
        run: |
          if npm run | grep -q " test"; then
            echo "Running tests"
            npm test
          else
            echo "No test script found; skipping tests"
          fi

      - name: Run npm audit (non-failing)
        run: |
          npm audit --audit-level=moderate || true

  docker:
    name: Build and push Docker image
    needs: [build, bump-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/authentication-service:${{ needs.bump-version.outputs.new_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/authentication-service:latest

